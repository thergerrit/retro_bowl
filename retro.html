<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self' data: blob:;
          script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
          connect-src 'self' data: blob:;
          img-src 'self' data: blob:;
          style-src 'self' 'unsafe-inline' data:;
          media-src 'self' data: blob:;
          font-src 'self' data:;
          worker-src 'self' blob:;
        ">
  <title>Retro Bowl — Offline</title>
  <style>
    html, body { background: #000; color: #ccc; width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    canvas { image-rendering: optimizeSpeed; -webkit-interpolation-mode: nearest-neighbor; -ms-touch-action: none; margin: 0; padding: 0; border: 0; }
    :-webkit-full-screen #canvas, :-webkit-full-screen { width: 100%; height: 100%; }
    .gm4html5_div_class { margin: 0; padding: 0; border: 0; }
  </style>
</head>
<body>
  <script>
    if (location.protocol === 'file:') {
      document.documentElement.innerHTML = `
        <div style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
                    color:#ddd; background:#111; height:100vh; display:flex; align-items:center; justify-content:center;">
          <div style="max-width:820px; padding:28px; border-radius:12px; background:#0f1412; box-shadow:0 8px 30px rgba(0,0,0,.6);">
            <h2 style="margin:0 0 12px 0; color:#cfe9c8">Please run this via a web server</h2>
            <p style="margin:0 0 12px 0; color:#bfc9be;">
              Running this file directly (file://) is not supported — start a local web server and open
              <code style="background:#0b0b0b;padding:2px 6px;border-radius:4px;color:#d6ffd8;">http://localhost:8000/retro.html</code>.
            </p>
            <p style="margin:0;color:#9faea0">Quick: run <code>python -m http.server 8000</code> in the exported folder, or use a node static server.</p>
          </div>
        </div>`;
      throw new Error('Running from file:// — start a web server');
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(r => r.unregister()))
        .catch(() => { /* ignore errors */ });
    }
  </script>

  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <img id="GM4HTML5_loadingscreen" alt="" style="display:none">
    <canvas id="canvas" width="960" height="540">
      <p>Your browser does not support HTML5 canvas.</p>
    </canvas>
  </div>
  <script>
(() => {
  "use strict";

  const assets = {"Achievements.txt":{"mimeType":"text/plain","base64":"dGFnCWRlc2NyaXB0aW9uCWFjaGlldmVkCkFDSF9QQVNTCU1ha2UgYSBwYXNzCTAKQUNIX1RPVUNIRE9XTjEJU2NvcmUgYSB0b3VjaGRvd24JMApBQ0hfVE9VQ0hET1dO"},"Achievements.txt": {"mimeType":"text/plain","base64":"dGFnCWRlc2NyaXB0aW9uCWFjaGlldmVkCkFDSF9QQVNTCU1ha2UgYSBwYXNzCTAKQUNIX1RPVUNIRE9XTjEJU2NvcmUgYSB0b3VjaGRvd24JMApBQ0hfVE9VQ0hET1dO"}};

  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d');

  function loadAsset(name) {
    const asset = assets[name];
    if (!asset) return null;
    const binary = atob(asset.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: asset.mimeType || 'application/octet-stream' });
  }

  const loading = document.getElementById('GM4HTML5_loadingscreen');
  if (loading) loading.style.display = 'none';

  context.fillStyle = '#000';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = '#fff';
  context.font = '20px sans-serif';
  context.fillText('Retro Bowl is loading...', 24, 42);

  try {
    const achievements = loadAsset('Achievements.txt');
    if (achievements) {
      console.info('Loaded embedded assets:', achievements.size, 'bytes');
    }
  } catch (error) {
    console.warn('Embedded asset load check failed:', error);
  }

})();
  </script>
</body>
</html>
